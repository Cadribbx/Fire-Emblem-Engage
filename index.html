<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas de personaje · Tier S</title>
<style>
:root{--bg:#F8F9FA;--card:#FFFFFF;--ink:#2B2D42;--mut:#6B7280;--line:#E5E7EB;--red:#E63946;--red2:#D62828;--gold:#D4AF37;--goldbg:#FBF5DC;--redbg:#FDECEE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151C;--card:#1E2029;--ink:#ECEDF2;--mut:#9AA0AE;--line:#2F3240;--goldbg:#3A3318;--redbg:#3B1C20}}
:root[data-theme="dark"]{--bg:#14151C;--card:#1E2029;--ink:#ECEDF2;--mut:#9AA0AE;--line:#2F3240;--goldbg:#3A3318;--redbg:#3B1C20}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
header h1 b{color:var(--red)}
header p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
.bar{height:3px;border-radius:3px;margin:12px 0 16px;background:linear-gradient(90deg,var(--red),var(--gold))}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input[type=search]{flex:1 1 240px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:.95rem}
.tools input:focus,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);padding:10px 13px;font-size:.85rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.dlc{border-top-color:var(--gold)}
.head{display:flex;gap:12px;align-items:center}
.av{position:relative;width:76px;height:76px;flex:none;border-radius:20%;padding:3px;background:linear-gradient(135deg,var(--red),var(--gold))}
.av>*{width:100%;height:100%;border-radius:18%;display:block;object-fit:cover;background:var(--card)}
.name{font-size:1.25rem;font-weight:800;margin:0;line-height:1.1}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;margin:4px 4px 0 0}
.b-h{background:var(--red);color:#fff}.b-d{background:var(--gold);color:#2B2D42}
.b-cl{background:var(--red2);color:#fff;border-radius:8px;font-size:.8rem}
.b-em{background:var(--goldbg);color:var(--ink);border:1px solid var(--gold);border-radius:8px;font-size:.8rem}
.row{font-size:.88rem}
.lb{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.row ul{margin:0;padding-left:18px}.row li{margin:1px 0}
.foot{margin-top:auto;border-top:1px dashed var(--line);padding-top:10px;font-size:.8rem;color:var(--mut);display:flex;gap:8px;align-items:center;justify-content:space-between}
.foot span:first-child{font-size:1.1rem}
.photo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:none;color:var(--mut);font-size:.72rem;padding:4px 9px;border-radius:8px;cursor:pointer}
.btn:hover{color:var(--red);border-color:var(--red)}
.urlbox{display:none;gap:6px;width:100%}.urlbox.open{display:flex}
.urlbox input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:.78rem}
/* lista compacta */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1.1fr 1.3fr 1.3fr 1.6fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;padding:8px 12px;font-size:.85rem}
.item.dlc{border-left-color:var(--gold)}
.item .av{width:48px;height:48px;padding:2px}
.item .name{font-size:1rem}
.item .sm{color:var(--mut);font-size:.78rem}
@media(max-width:760px){.item{grid-template-columns:auto 1fr auto}.item>.c{grid-column:1/-1}}
.empty{text-align:center;color:var(--mut);padding:40px 0}
footer{margin-top:28px;text-align:center;color:var(--mut);font-size:.78rem}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Fichas de personaje · <b>Tier S</b></h1>
  <p>Fire Emblem Engage · <span id="count">12</span> personajes</p>
  <div class="bar"></div>
</header>
<div class="tools">
  <input type="search" id="q" placeholder="Busca por nombre, clase, habilidad o emblema" aria-label="Buscar">
  <div class="seg" id="origin" role="group" aria-label="Origen">
    <button data-v="all" class="on">Todos</button><button data-v="Historia">Historia Principal</button><button data-v="DLC">DLC</button>
  </div>
  <div class="seg" id="mode" role="group" aria-label="Vista">
    <button data-v="cards" class="on">Tarjetas detalladas</button><button data-v="list">Lista compacta</button>
  </div>
</div>
<main id="out"></main>
<footer>Resumido de tus notas</footer>
</div>
<input type="file" id="file" accept="image/*" hidden>

{id:"pandreo",name:"Pandreo",type:"Historia",obtencion:"Capítulo 14",rendimiento:"Usuario mágico ofensivo altamente confiable con altos crecimientos en Destreza y Velocidad.",clase:"Caballero Mágico",emblema:"Emblemas Mágicos (Soren / Celica / Byleth)",habilidades:"Habilidad Personal: Aumenta Golpe y Evasión progresivamente por cada unidad cercana",visualDesc:"Pelo rubio claro corto con cuello alto de clérigo",icon:"🪄",initials:"PD",hairColor:"#F4D35E"},
{id:"hortensia",name:"Hortensia",type:"Historia",obtencion:"Capítulo 14",rendimiento:"La mejor usuaria de Bastones de soporte del juego; altísima Resistencia (vulnerable casi únicamente a arqueros).",clase:"Jinete Sleipnir (Clase avanzada única)",emblema:"Emblemas de soporte/curación (Micaiah)",habilidades:"Rango de bastones extendido por 'Personalidad Arrolladora' + Movimiento volador",visualDesc:"Pelo rosa en tirabuzones haciendo el gesto de la paz",icon:"✨",initials:"HT",hairColor:"#FF85A1"},
{id:"seadall",name:"Seadall",type:"Historia",obtencion:"Capítulo 15",rendimiento:"Único personaje con la clase Bailarín; otorga un turno extra a la mejor unidad; alta Velocidad y Evasión.",clase:"Bailarín",emblema:"Corrin / Tiki",habilidades:"Curación pasiva con Danza Curiosa + Tiempo para Ti (Corrin) + Geoesfera (Tiki)",visualDesc:"Pelo negro largo y liso con cinta amarilla",icon:"💃",initials:"SD",hairColor:"#2B2D42"},
{id:"veyle",name:"Veyle",type:"Historia",obtencion:"Capítulo 22",rendimiento:"Estadísticas elevadas tanto en Magia como en Fuerza para daño híbrido devastador.",clase:"Dragón / Atacante Mágico",emblema:"Byleth (Bonificación de tipo Dragón)",habilidades:"Recargar e invocar spam de acciones Engage (como Danza de la Diosa de Byleth)",visualDesc:"Pelo lila / blanco con tiara plateada",icon:"👑",initials:"VY",hairColor:"#B8C0FF"},
{id:"nil",name:"Nil",type:"DLC",obtencion:"DLC: Xenolaboratorio Caído (Recom. Cap. 15-16, Nivel int. 20)",rendimiento:"Tanque frontal tipo Dragón; recibe bonificaciones de todos los Emblemas.",clase:"Dragón / Tanque Frontal",emblema:"Cualquier Emblema con bonificación Dragón",habilidades:"Piedra Ruina Caída (reducción de defensa a distancia) + 2000 SP iniciales",visualDesc:"Pelo rosado / blanco con traje oscuro de cuello alto",icon:"🛡️",initials:"NL",hairColor:"#D8B4F8"},
{id:"zelestia",name:"Zelestia",type:"DLC",obtencion:"DLC: Xenolaboratorio Caído (Recom. Cap. 15-16, Nivel int. 20)",rendimiento:"Mago volador que usa Tomo y Espada; Fuerza decente para daño híbrido.",clase:"Voladora (Tomo y Espada)",emblema:"Emblemas híbridos o mágicos",habilidades:"Habilidad de clase única especializada en cazar y eliminar magos enemigos",visualDesc:"Pelo rubio con cuernos / diadema oscura y velo",icon:"🗡️",initials:"ZL",hairColor:"#FFE5EC"}
];
const state={q:"",origin:"all",mode:"cards",custom:{},failed:{}};
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bullets=s=>s.split(/\s\+\s|\s\/\s/).map(x=>x.trim()).filter(Boolean);
function svgAvatar(c){
  const g=c.hairColor.indexOf("gradient")>-1;
  const fill=g?"url(#g"+c.id+")":c.hairColor;
  const defs=g?'<defs><linearGradient id="g'+c.id+'" x1="0" y1="0" x2="1" y2="1"><stop offset=".5" stop-color="#0077B6"/><stop offset=".5" stop-color="#E63946"/></linearGradient></defs>':"";
  return '<svg viewBox="0 0 80 80" role="img" aria-label="Avatar de '+esc(c.name)+'">'+defs+'<rect width="80" height="80" fill="'+fill+'"/><text x="40" y="34" text-anchor="middle" font-size="24">'+c.icon+'</text><text x="40" y="64" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" stroke="#2B2D42" stroke-width="3" paint-order="stroke" font-family="system-ui,sans-serif">'+c.initials+'</text></svg>';
}
function avatar(c){
  const f=state.failed[c.id]||0;
  let src=null;
  if(state.custom[c.id]&&f<1)src=state.custom[c.id];
  else if(IMGS[c.id]&&f<2)src=IMGS[c.id];
  return '<div class="av">'+(src?'<img src="'+esc(src)+'" alt="'+esc(c.name)+'" data-id="'+c.id+'">':svgAvatar(c))+'</div>';
}
function photoCtl(c){
  return '<div class="photo"><button class="btn" data-up="'+c.id+'">📷 Cambiar Foto</button><button class="btn" data-url="'+c.id+'">Pegar URL</button><div class="urlbox" id="u-'+c.id+'"><input type="url" placeholder="https://…" aria-label="URL de foto"><button class="btn" data-go="'+c.id+'">OK</button></div></div>';
}
function card(c){
  const dlc=c.type==="DLC";
  return '<article class="card'+(dlc?" dlc":"")+'"><div class="head">'+avatar(c)+'<div><h2 class="name">'+esc(c.name)+'</h2><span class="badge '+(dlc?"b-d":"b-h")+'">'+(dlc?"DLC":"Historia")+'</span><span class="badge b-h" style="background:var(--ink);color:var(--bg)">Tier S</span></div></div>'
  +'<div class="row"><span class="lb">🗺️ Consíguelo</span>'+esc(c.obtencion)+'</div>'
  +'<div class="row"><span class="lb">Rendimiento</span>'+esc(c.rendimiento)+'</div>'
  +'<div class="row"><span class="lb">Mejor clase final</span><span class="badge b-cl">'+esc(c.clase)+'</span></div>'
  +'<div class="row"><span class="lb">Mejor emblema / equipo</span><span class="badge b-em">'+esc(c.emblema)+'</span></div>'
  +'<div class="row"><span class="lb">Habilidades / combos</span><ul>'+bullets(c.habilidades).map(b=>'<li>'+esc(b)+'</li>').join("")+'</ul></div>'
  +'<div class="foot"><span>'+c.icon+'</span><span style="flex:1">'+esc(c.visualDesc)+'</span></div>'+photoCtl(c)+'</article>';
}
function item(c){
  const dlc=c.type==="DLC";
  return '<article class="item'+(dlc?" dlc":"")+'">'+avatar(c)+'<div><h2 class="name">'+esc(c.name)+'</h2><span class="badge '+(dlc?"b-d":"b-h")+'">'+(dlc?"DLC":"Historia")+'</span></div>'
  +'<div class="c"><span class="lb">Clase</span><span class="badge b-cl">'+esc(c.clase)+'</span></div>'
  +'<div class="c"><span class="lb">Emblema</span><span class="badge b-em">'+esc(c.emblema)+'</span></div>'
  +'<div class="c sm"><span class="lb">Consíguelo</span>'+esc(c.obtencion)+'</div>'+photoCtl(c)+'</article>';
}
function render(){
  const q=norm(state.q.trim());
  const res=charactersData.filter(c=>(state.origin==="all"||c.type===state.origin)&&(!q||norm([c.name,c.clase,c.habilidades,c.emblema].join(" ")).indexOf(q)>-1));
  $("#count").textContent=res.length;
  const out=$("#out");
  out.innerHTML=res.length?'<div class="'+(state.mode==="cards"?"grid":"list")+'">'+res.map(state.mode==="cards"?card:item).join("")+'</div>':'<p class="empty">Nada con ese filtro. Prueba con otro.</p>';
}
function seg(id,key){
  $(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    state[key]=b.dataset.v;[].forEach.call($(id).children,x=>x.classList.toggle("on",x===b));render();});
}
seg("#origin","origin");seg("#mode","mode");
$("#q").addEventListener("input",e=>{state.q=e.target.value;render();});
let upId=null;
$("#out").addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.up){upId=t.dataset.up;$("#file").click();}
  else if(t.dataset.url){const b=document.getElementById("u-"+t.dataset.url);b.classList.toggle("open");const i=b.querySelector("input");if(i)i.focus();}
  else if(t.dataset.go){const v=document.getElementById("u-"+t.dataset.go).querySelector("input").value.trim();
    if(/^https?:\/\//i.test(v)){state.custom[t.dataset.go]=v;state.failed[t.dataset.go]=0;render();}}
});
$("#out").addEventListener("error",e=>{
  const t=e.target;if(t.tagName!=="IMG")return;
  const id=t.dataset.id;state.failed[id]=(state.failed[id]||0)+1;
  if(!state.custom[id])state.failed[id]=2;
  render();
},true);
$("#file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f||!upId)return;
  const r=new FileReader();
  r.onload=()=>{state.custom[upId]=r.result;state.failed[upId]=0;render();};
  r.readAsDataURL(f);e.target.value="";
});
render();
</script>
</body>
</html>
